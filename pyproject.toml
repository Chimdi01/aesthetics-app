[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
# 120, not the 88-char default: this codebase was written with
# descriptive logger messages and explanatory inline comments as a
# deliberate style choice (see CLAUDE.md's "How to work with the person
# on this"), not against a line-length budget. Retroactively enforcing
# 88 would mean reformatting ~400 lines for no bug-catching benefit;
# 120 matches actual existing practice (99% of lines already fit) and
# still catches genuinely-too-long lines.
line-length = 120
# alembic/versions/ is autogenerated boilerplate (the `alembic revision`
# command writes it, not a human) — linting it just means re-fighting
# the same style findings (old-style Union[] typing, unsorted imports)
# every time a new migration is generated, for files nobody hand-edits
# except to fix a specific generation gotcha (see CLAUDE.md).
exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP", "SIM", "RUF"]
ignore = [
    # FastAPI's entire DI system is built on calling Depends()/Query()/
    # File()/Form() etc. as a parameter DEFAULT — that's the documented,
    # required pattern, not the "mutable default argument" bug this rule
    # exists to catch.
    "B008",
    # Suggests replacing every `class Foo(str, enum.Enum)` with
    # `class Foo(enum.StrEnum)` across all 11 enum classes project-wide.
    # Purely cosmetic for how these enums are actually used here (as
    # Pydantic field types and Postgres ARRAY(Enum) columns) — no behavior
    # difference either way, so not worth touching 11 files for it.
    "UP042",
]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
# Async SQLAlchemy 2.0's Mapped[] typing plus FastAPI's heavy use of
# dependency-injected, decorator-wrapped functions makes a fully strict
# mypy pass (no untyped defs, no Any) a bigger, separate effort than
# "add a type checker" warrants right now — start permissive-but-real
# (catches genuine type errors in code that IS annotated) and tighten
# later rather than disabling whole files to force strict mode on day one.
disallow_untyped_defs = false
ignore_missing_imports = true
